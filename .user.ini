; يرفع حدود رفع الملفات وزمن التنفيذ (تعمل تلقائيًا على أغلب استضافات PHP كـ CGI/FastCGI مثل Hostinger)
; ملاحظة: على بعض الاستضافات (مثل هوستنكر) هذا الملف قد لا يُطبَّق، والحدود الفعلية تُضبط من
; hPanel ← Advanced ← PHP Configuration ← PHP options بدلًا من هذا الملف
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
